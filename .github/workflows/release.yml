name: release

# Cutting a release:
#   git tag v2.0.0-preview1000 && git push origin v2.0.0-preview1000
#
# The tag is the single source of truth for the published version. Requires a NUGET_API_KEY
# repository secret with push rights for the CSharpAuthor package ID on nuget.org.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v), e.g. 2.0.0-preview1000'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The library targets netstandard2.0; the test project runs on net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          # A manual dispatch runs against whatever ref was selected, and that selector remembers
          # the last branch used. Without this, an unreviewed branch could be published to
          # nuget.org, where a version can be unlisted but never removed.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be dispatched from main. This run is on '${GITHUB_REF_NAME}'."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Guard against a mistyped tag producing a bad package version.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - run: dotnet restore CSharpAuthor.sln

      - run: dotnet build CSharpAuthor.sln --no-restore --configuration Release

      - run: dotnet test CSharpAuthor.Tests --no-build --configuration Release

      # The library must stay free of Roslyn: it is source-compiled into consumers that target
      # netstandard2.0, and a dependency here becomes their problem. This checks the packed
      # layout, not just the build.
      - name: Verify packaging
        run: ./scripts/verify-roslyn-packaging.sh

      - name: Pack
        run: |
          dotnet pack CSharpAuthor/CSharpAuthor.csproj --configuration Release --output ./artifacts \
            "/p:PackageVersion=${{ steps.version.outputs.version }}"
          ls -la ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ipjohnson/index.json" \
            --skip-duplicate --no-symbols

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A prerelease tag is marked as one, so it does not become the "latest" release.
          PRERELEASE=""
          case "${{ steps.version.outputs.version }}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" ./artifacts/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
